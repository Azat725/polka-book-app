          type: string
          maxLength: 255
        size:
          type: integer
          maximum: 100000000
          minimum: 1
      required:
      - filename
      - size
    UploadSession:
      type: object
      properties:
        id:
          type: string
          format: uuid
        filename:
          type: string
        size:
          type: integer
        state:
          type: string
        chunk_size:
          type: integer
        uploaded_chunks:
          type: array
          items:
            type: integer
        chunk_checksums:
          type: object
          additionalProperties:
            type: string
        expires_at:
          type: string
          format: date-time
      required:
      - chunk_checksums
      - chunk_size
      - expires_at
      - filename
      - id
      - size
      - state
      - uploaded_chunks
  securitySchemes:
    Bearer:
      type: http
      scheme: bearer
